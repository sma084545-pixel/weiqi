<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>装配分层示意</title>
  <desc>磁性棋盘、棋子磁背和收纳的可编辑A4图示</desc>
  <metadata>schemaVersion=1; id=T18-DEMO-BOARD; revision=1; rulesetId=GO-CLUB-AREA-1; units=mm</metadata>
  <style>
    text { font-family: "Arial Unicode MS", "PingFang SC", sans-serif; fill: #18211C; }
    .grid-line { stroke: #263028; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
    .cut-line { stroke: #777; stroke-width: .35; stroke-dasharray: 2 1; fill: none; }
    .note { font-size: 4px; } .small { font-size: 3.2px; } .label { font-size: 5px; font-weight: 700; }
  </style>
<rect width="210" height="297" fill="#FFFFFF"/>
<text x="105" y="15" class="label" text-anchor="middle" >磁性演示盘分层与收纳示意</text>
<rect x="25" y="45" width="120" height="18" rx="2" fill="#E9F5F3" stroke="#18211C"/><text x="85" y="57" font-size="5" text-anchor="middle">哑面保护膜</text>
<text x="160" y="57" class="small" text-anchor="start" >↓ 对齐并压实</text>
<rect x="32" y="69" width="120" height="18" rx="2" fill="#EDC585" stroke="#18211C"/><text x="92" y="81" font-size="5" text-anchor="middle">1:1 打印棋盘面</text>
<text x="160" y="81" class="small" text-anchor="start" >↓ 对齐并压实</text>
<rect x="39" y="93" width="120" height="18" rx="2" fill="#B7BDC1" stroke="#18211C"/><text x="99" y="105" font-size="5" text-anchor="middle">含铁薄板 0.4–0.6 mm</text>
<text x="160" y="105" class="small" text-anchor="start" >↓ 对齐并压实</text>
<rect x="46" y="117" width="120" height="18" rx="2" fill="#E7E1D7" stroke="#18211C"/><text x="106" y="129" font-size="5" text-anchor="middle">硬质背板 3–5 mm</text>
<text x="20" y="155" class="label" text-anchor="start" >棋子截面</text>
<circle cx="45" cy="185" r="19" fill="#111"/><rect x="29" y="207" width="32" height="4" rx="1" fill="#666"/><text x="75" y="184" class="note" text-anchor="start" >38 mm 棋面</text><text x="75" y="210" class="note" text-anchor="start" >34–36 mm 柔性磁背</text>
<text x="20" y="240" class="note" text-anchor="start" >收纳袋：黑｜白｜气环｜三角｜数字｜最后一手｜修补件</text>
<text x="20" y="252" class="note" text-anchor="start" >先做各 1 枚样品；磁吸、耐用、反光、后排可读性待实测。</text>
