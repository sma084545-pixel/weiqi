<text x="355.0" y="118" class="label" text-anchor="middle" >L形 D5/E5/D4</text>
<text x="355.0" y="125" class="note" text-anchor="middle" >去重气数：7</text>
<text x="20" y="142" class="label" text-anchor="start" >流程 A｜中心、边、角</text>
<text x="20" y="152" class="note" text-anchor="start" >① E5 放黑棋；成员用气环圈 E6/D5/F5/E4 → 4 气。</text>
<text x="20" y="161" class="note" text-anchor="start" >② 清空后移到 E9；圈 D9/F9/E8 → 3 气；板外不算。</text>
<text x="20" y="170" class="note" text-anchor="start" >③ 清空后移到 A9；圈 B9/A8 → 2 气。</text>
<text x="20" y="179" class="note" text-anchor="start" >④ 成员把数字 4/3/2 放到三个标题旁，说出差异来自边界。</text>
<text x="220" y="142" class="label" text-anchor="start" >流程 B｜L 形连通块与共享气去重</text>
<text x="220" y="152" class="note" text-anchor="start" >① 放 D5、E5、D4；目标三角指出同一正交连通块。</text>
<text x="220" y="161" class="note" text-anchor="start" >② 在 D6/C5/E6/F5/E4/C4/D3 放 7 个气环。</text>
<text x="220" y="170" class="note" text-anchor="start" >③ E4 同时邻接 E5 和 D4；重复放第二个环后立即移走。</text>
<text x="220" y="179" class="note" text-anchor="start" >④ 8 个相邻空位槽中 E4 重复一次；去重集合为 7 气。</text>
<rect x="20" y="200" width="380" height="70" rx="4" fill="#F3F6F4" stroke="#CED8D1"/>
<text x="30" y="214" class="label" text-anchor="start" >教师语言模板</text>
<text x="30" y="225" class="note" text-anchor="start" >“气只沿棋盘线找；斜角不算。数整块时，同一个空交叉点只报一次。”</text>
<text x="30" y="238" class="note" text-anchor="start" >成员动作：每找到一个不同空点就放一个双虚线气环；重复点必须拿掉重复环。</text>
<text x="30" y="251" class="note" text-anchor="start" >预期观察：单子中心/边/角为 4/3/2；L 形三子块为 7 个不同气点。</text>
<text x="30" y="263" class="note" text-anchor="start" >证据边界：这是准确坐标生成的教学示例；未填人类教师审核或学生成效。</text>
</svg>
