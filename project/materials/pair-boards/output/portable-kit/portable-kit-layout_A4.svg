<text x="30.000" y="174.000" font-size="3.500mm" text-anchor="start" fill="#111111" font-weight="bold" class="">透明覆片</text>
<text x="30.000" y="183.000" font-size="2.800mm" text-anchor="start" fill="#111111" font-weight="normal" class="">先圈气再落子</text>
<text x="30.000" y="200.000" font-size="2.400mm" text-anchor="start" fill="#555555" font-weight="normal" class="">与棋盘同尺寸</text>
<rect x="108.000" y="164.000" width="74.000" height="42.000" rx="2.000" fill="#FFFFFF" stroke="#51747C" stroke-width="0.350" class="kit-item"/>
<text x="113.000" y="174.000" font-size="3.500mm" text-anchor="start" fill="#111111" font-weight="bold" class="">规则卡固定袋</text>
<text x="113.000" y="183.000" font-size="2.800mm" text-anchor="start" fill="#111111" font-weight="normal" class="">封面内侧</text>
<text x="113.000" y="200.000" font-size="2.400mm" text-anchor="start" fill="#555555" font-weight="normal" class="">正面朝外</text>
<text x="15.000" y="232.000" font-size="3.800mm" text-anchor="start" fill="#111111" font-weight="bold" class="">套数公式</text>
<text x="15.000" y="241.000" font-size="3.200mm" text-anchor="start" fill="#111111" font-weight="normal" class="">基础套数 = ⌈实际参与人数 ÷ 2⌉</text>
<text x="15.000" y="249.000" font-size="2.800mm" text-anchor="start" fill="#111111" font-weight="normal" class="">准备套数 = 基础套数 + 教师填写的备用套数（建议先从 1 套或约 10% 试配，不冒充已确认需求）</text>
<text x="15.000" y="257.000" font-size="2.800mm" text-anchor="start" fill="#111111" font-weight="normal" class="">若人数为奇数：仍按向上取整；可由一组轮换观察/记录，但不强制计时或排名。</text>
<text x="15.000" y="265.000" font-size="2.800mm" text-anchor="start" fill="#111111" font-weight="normal" class="">A3 板需 A3 封套；追求更便携时，用两页 A4 拼接版并在桌面临时对齐。覆膜 A3 不建议折叠。</text>
