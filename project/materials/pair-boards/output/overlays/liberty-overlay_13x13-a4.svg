<text x="105.000" y="23.000" font-size="2.800mm" text-anchor="middle" fill="#111111" font-weight="normal" class="">本页不含答案。与 13×13 A4 棋盘四角标记对齐后，用可擦写笔圈出气（liberties）。</text>
<text x="15.000" y="240.000" font-size="3.000mm" text-anchor="start" fill="#111111" font-weight="normal" class="">顺序：① 选一块棋  ② 圈出全部正交相邻空点  ③ 再讨论并落子  ④ 擦除标记</text>
<text x="15.000" y="248.000" font-size="2.800mm" text-anchor="start" fill="#111111" font-weight="normal" class="">透明片/文件袋必须先试擦；不要把示范答案永久印在正常对弈盘上。</text>
<text x="15.000" y="256.000" font-size="2.600mm" text-anchor="start" fill="#111111" font-weight="normal" class="">A4 210×297 mm | 对应格距 14 mm | 适用棋子直径 11-12 mm | 100% 打印</text>
