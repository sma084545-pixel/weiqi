ns CJK SC, sans-serif" font-size="2.82222" fill="#192E32">a</ns0:text><ns0:text x="71.9" y="107.2" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.82222" fill="#192E32">b</ns0:text><ns0:text x="47.9" y="83.2" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.82222" fill="#192E32">×</ns0:text><ns0:text x="59.9" y="83.2" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.82222" fill="#192E32">×</ns0:text><ns0:text x="71.9" y="83.2" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.82222" fill="#192E32">×</ns0:text><ns0:text x="83.9" y="83.2" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.82222" fill="#192E32">×</ns0:text><ns0:text x="95.9" y="83.2" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.82222" fill="#192E32">×</ns0:text><ns0:text x="10" y="117" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">上为5行，左为A列。目标：分别数活子和围空。</ns0:text><ns0:text x="10" y="122.7" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">a＝黑围空C5；b＝白围空C1；×＝中立点。</ns0:text><ns0:rect x="10" y="131" width="128" height="8" fill="#EDF3F2" stroke="#EDF3F2" stroke-width="0.3" /><ns0:text x="12" y="136" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.88056" fill="#235B60">开局贴目0：黑10，白10，和棋</ns0:text><ns0:text x="10" y="147" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">黑：9颗活子＋1个围空＝10。</ns0:text><ns0:text x="10" y="152.7" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">白：9颗活子＋1个围空＋0贴目＝10。</ns0:text><ns0:text x="10" y="158.39999999999998" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">中立点（neutral point / dame）：A3–E3共5点。</ns0:text><ns0:text x="10" y="164.09999999999997" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">核对：18颗子＋2个围空＋5个中立＝25点。</ns0:text><ns0:text x="10" y="171.79999999999995" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.52778" fill="#192E32">提子不另加分。另开一例若贴目0.5，白为10.5。</ns0:text><ns0:text x="10" y="177.29999999999995" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.52778" fill="#192E32">默认0、允许和棋是教学约定；不是官方标准。</ns0:text><ns0:text x="10" y="182.79999999999995" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.52778" fill="#192E32">未完成对局的染色只是预览，不是最终胜负。</ns0:text></ns0:svg><ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="148" height="210" viewBox="0 0 148 210" x="148.5" y="0"><ns0:title>05-score</ns0:title><ns0:metadata>{"schemaVersion": 1, "id": "T20-05-score", "revision": 1, "rulesetId": "GO-CLUB-AREA-1", "baseVersion": "0.2.0", "resultVersion": "0.2.0-t20.1", "pair": "03 \u6b63\u9762\uff08\u8ba1\u5206\uff09\u2194 03 \u80cc\u9762\uff08\u8def\u7ebf\uff09", "widthMm": 148, "heightMm": 210}</ns0:metadata><ns0:rect x="0" y="0" width="148" height="5" fill="#235B60" stroke="#235B60" stroke-width="0.3" /><ns0:text x="10" y="16" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="6.70278" fill="#192E32">一起算一次 · 面积计分</ns0:text><ns0:text x="10" y="24" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.17500" fill="#235B60">计分例卡 · 完整5×5小棋盘教学算例</ns0:text><ns0:line x1="10" y1="193" x2="138" y2="193" stroke="#A0AFAF" stroke-width="0.25" /><ns0:text x="10" y="198" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.46944" fill="#192E32">03 正面（计分）↔ 03 背面（路线）  |  GO-CLUB-AREA-1</ns0:text><ns0:text x="10" y="202" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.11667" fill="#192E32">T20-05-score · schemaVersion 1 · revision 1</ns0:text><ns0:text x="10" y="35" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">明确教学假设：盘上棋子均按活子计、无死子；</ns0:text><ns0:text x="10" y="40.7" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">A3–E3为中立点。这不证明棋形无条件活。<