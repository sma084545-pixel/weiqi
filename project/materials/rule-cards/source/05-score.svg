ize="2.82222" fill="#192E32">×</text><text x="71.9" y="83.2" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.82222" fill="#192E32">×</text><text x="83.9" y="83.2" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.82222" fill="#192E32">×</text><text x="95.9" y="83.2" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="2.82222" fill="#192E32">×</text><text x="10" y="117" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">上为5行，左为A列。目标：分别数活子和围空。</text><text x="10" y="122.7" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">a＝黑围空C5；b＝白围空C1；×＝中立点。</text><rect x="10" y="131" width="128" height="8" fill="#EDF3F2" stroke="#EDF3F2" stroke-width="0.3"/><text x="12" y="136" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.88056" fill="#235B60">开局贴目0：黑10，白10，和棋</text><text x="10" y="147" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">黑：9颗活子＋1个围空＝10。</text><text x="10" y="152.7" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">白：9颗活子＋1个围空＋0贴目＝10。</text><text x="10" y="158.39999999999998" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">中立点（neutral point / dame）：A3–E3共5点。</text><text x="10" y="164.09999999999997" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.70417" fill="#192E32">核对：18颗子＋2个围空＋5个中立＝25点。</text><text x="10" y="171.79999999999995" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.52778" fill="#192E32">提子不另加分。另开一例若贴目0.5，白为10.5。</text><text x="10" y="177.29999999999995" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.52778" fill="#192E32">默认0、允许和棋是教学约定；不是官方标准。</text><text x="10" y="182.79999999999995" font-family="Heiti SC, Noto Sans CJK SC, sans-serif" font-size="3.52778" fill="#192E32">未完成对局的染色只是预览，不是最终胜负。</text></svg>