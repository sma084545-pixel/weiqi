# FREE ONLY. One new isolated model service; existing services unchanged.
# 0.1CPU/512MB. No disk, database, paid add-on, or autoscaling.
services:
  - type: web
    name: weiqi-katago-extreme
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    rootDir: project
    dockerfilePath: analysis-engine/Dockerfile.extreme
    dockerContext: .
    healthCheckPath: /readyz
    autoDeployTrigger: off
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://sma084545-pixel.github.io
      - key: KATAGO_MAX_VISITS
        value: "64"
