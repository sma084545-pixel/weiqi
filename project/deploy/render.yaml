{
  "services": [
    {
      "type": "web",
      "name": "weiqi-rooms",
      "runtime": "node",
      "plan": "free",
      "repo": "https://github.com/sma084545-pixel/weiqi",
      "branch": "main",
      "rootDir": "project",
      "region": "singapore",
      "numInstances": 1,
      "autoDeployTrigger": "off",
      "buildCommand": "corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build",
      "startCommand": "node dist-server/server.mjs",
      "healthCheckPath": "/api/online/health",
      "envVars": [
        {
          "key": "NODE_VERSION",
          "value": "22.23.3"
        },
        {
          "key": "NODE_ENV",
          "value": "production"
        },
        {
          "key": "HOST",
          "value": "0.0.0.0"
        },
        {
          "key": "PUBLIC_ORIGIN",
          "value": "https://sma084545-pixel.github.io"
        },
        {
          "key": "PUBLIC_APP_URL",
          "value": "https://sma084545-pixel.github.io/weiqi/#/play/online"
        },
        {
          "key": "GO_CLUB_DATA_FILE",
          "value": "/tmp/go-club/rooms.json"
        }
      ]
    }
  ]
}
