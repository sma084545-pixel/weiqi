# KataGo v1.18.1 Eigen CPU: bounded shared review service. No GPU required.
# No request/response logs or unbounded on-disk engine logs.
logToStderr = true
logAllRequests = false
logAllResponses = false
logErrorsAndWarnings = true
logSearchInfo = false
warnUnusedFields = true

reportAnalysisWinratesAs = BLACK
analysisPVLen = 10
maxVisits = 64
maxTime = 15
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 1
numEigenThreadsPerModel = 1
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 12
nnMutexPoolSizePowerOfTwo = 8
maxBoardXSizeForNNBuffer = 19
maxBoardYSizeForNNBuffer = 19
nnRandomize = true
conservativePass = true
preventCleanupPhase = true
assumeMultipleStartingBlackMovesAreHandicap = false
ignorePreRootHistory = false
