name: KataGo extreme real model and capacity
on:
  push:
    branches: [feat/extreme-ai]
    paths: ['project/server/analysis/**', 'project/src/core/**', 'project/analysis-engine/**', 'project/scripts/extreme-real-smoke.mjs', '.github/workflows/katago-extreme-container.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: katago-extreme-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.3'
      - name: Build pinned portable Eigen engine and official strong model
        run: docker build --progress=plain -f project/analysis-engine/Dockerfile.extreme -t weiqi-katago:extreme project
      - name: Build shared legal-move verifier
        working-directory: project
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --prod=false
          corepack pnpm build:engine
      - name: Measure free-sized memory limit without changing any Render resource
        run: |
          mkdir -p evidence
          docker run -d --name extreme-free --memory=512m --memory-swap=512m --cpus=0.1 -p 4208:10000 weiqi-katago:extreme
          for step in $(seq 1 40); do
            docker exec extreme-free cat /sys/fs/cgroup/memory.events > evidence/free-memory-events.txt || break
            if grep -Eq '^oom_kill [1-9]' evidence/free-memory-events.txt; then break; fi
            if curl --silent --fail http://127.0.0.1:4208/readyz -o evidence/free-ready.json; then break; fi
            sleep 3
          done
          docker exec extreme-free cat /sys/fs/cgroup/memory.peak > evidence/free-memory-peak-bytes.txt || true
          curl --silent http://127.0.0.1:4208/healthz -o evidence/free-health.json || true
          docker logs extreme-free > evidence/free-stdout.log 2> evidence/free-stderr.log || true
          docker rm -f extreme-free
      - name: Run actual strong-model API under 1CPU and 2GB
        run: |
          docker run -d --name extreme-standard --memory=2g --memory-swap=2g --cpus=1 -p 4207:10000 weiqi-katago:extreme
          KATAGO_TEST_ORIGIN=http://127.0.0.1:4207 KATAGO_TEST_LOCATION=github-actions-linux-docker-1cpu-2g EXTREME_TEST_REPORT=evidence/extreme-real-http.json node project/scripts/extreme-real-smoke.mjs
          docker exec extreme-standard cat /sys/fs/cgroup/memory.peak > evidence/memory-peak-bytes.txt
          docker exec extreme-standard cat /sys/fs/cgroup/memory.events > evidence/memory-events.txt
          docker inspect --format '{{json .State}}' extreme-standard > evidence/container-state.json
          docker exec extreme-standard /opt/katago/katago version > evidence/engine-version.txt
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p evidence
          docker logs extreme-standard > evidence/container-stdout.log 2> evidence/container-stderr.log || true
          docker inspect extreme-standard --format '{{json .HostConfig}}' > evidence/resource-limits.json || true
          docker rm -f extreme-free extreme-standard || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: katago-extreme-container-evidence
          path: evidence/
          retention-days: 14
